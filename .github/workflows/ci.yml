name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  LIBRARY_PROJECTS: >-
    SharpMediaInfo.Native/SharpMediaInfo.Native.csproj
    SharpMediaInfo/SharpMediaInfo.csproj
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  AVALONIA_PROJECT: SharpMediaInfo.GUI.Avalonia/SharpMediaInfo.GUI.Avalonia.csproj
  WPF_PROJECT: SharpMediaInfo.GUI.WPF/SharpMediaInfo.GUI.WPF.csproj

# Stages: Version -> Native (per RID, from the MediaInfoLib submodule) -> Test / Pack / Build GUI
#         -> Release (master) / Pre-release (PR) -> Publish (GitHub Packages, nuget.org)
jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      # Full version stamped into the build and artifact names: "25.10.0" on master,
      # "25.10.0-pr.12.34" (PR number, workflow run number) on a pull request.
      version: ${{ steps.resolve.outputs.version }}
      version_prefix: ${{ steps.resolve.outputs.version_prefix }}
      version_suffix: ${{ steps.resolve.outputs.version_suffix }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read version from Directory.Build.props
        id: resolve
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PREFIX=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error file=Directory.Build.props::No <Version> found"
            exit 1
          fi

          if [ -n "$PR_NUMBER" ]; then
            SUFFIX="pr.${PR_NUMBER}.${RUN_NUMBER}"
            VERSION="${PREFIX}-${SUFFIX}"
          else
            SUFFIX=""
            VERSION="$PREFIX"
          fi

          {
            echo "version=$VERSION"
            echo "version_prefix=$PREFIX"
            echo "version_suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$PREFIX" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            if [ -n "$PR_NUMBER" ]; then
              # Merging as-is wouldn't publish anything - say so while it's still cheap to fix.
              echo "::warning file=Directory.Build.props::v$PREFIX is already released - bump <Version> before merging, or master won't publish a new release."
            else
              echo "::notice::Tag v$PREFIX already present - skip"
            fi
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Native (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # win-arm64 is not built: the pinned ZenLib MSVC project has no ARM64 configuration.
          - rid: win-x64
            label: Windows x64
            os: windows-latest
          - rid: linux-x64
            label: Linux x64
            os: ubuntu-latest
          - rid: linux-arm64
            label: Linux arm64
            os: ubuntu-24.04-arm
          # One universal build on Apple Silicon, split into osx-arm64 and osx-x64
          # (Intel macOS runner images are retired).
          - rid: osx
            label: macOS universal
            os: macos-latest
    steps:
      # Submodules are fetched only on a cache miss (see below).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The native depends only on the pinned submodule commits and the build scripts,
      # so key the cache on those and skip checkout + build when nothing changed.
      - name: Compute native cache key
        id: key
        shell: bash
        run: |
          SUBMODULES=$(git ls-tree HEAD extern/ | sha256sum | cut -c1-16)
          echo "submodules=$SUBMODULES" >> "$GITHUB_OUTPUT"

      - name: Restore native cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: SharpMediaInfo.Native/native
          key: native-${{ matrix.rid }}-${{ steps.key.outputs.submodules }}-${{ hashFiles('SharpMediaInfo.Native/build/build-native.*') }}

      - name: Fetch submodules
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init --recursive --depth 1

      - name: Install build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config zlib1g-dev

      - name: Install build tools (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install cmake

      - name: Build native (${{ matrix.rid }})
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File SharpMediaInfo.Native/build/build-native.ps1 -Rid ${{ matrix.rid }}
          else
            bash SharpMediaInfo.Native/build/build-native.sh ${{ matrix.rid }}
          fi

      - name: Save native cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: SharpMediaInfo.Native/native
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The whole native/ folder holds only this job's <rid>/ folder(s), so the artifact
      # keeps them and Test/Pack can download straight into native/.
      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: SharpMediaInfo.Native/native
          if-no-files-found: error

  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: [native]
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            label: Linux x64
            os: ubuntu-latest
            native: linux-x64
          - rid: win-x64
            label: Windows x64
            os: windows-latest
            native: win-x64
          - rid: osx-arm64
            label: macOS arm64
            os: macos-latest
            native: osx
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the MediaInfoLib CSVs are needed here; the native comes prebuilt.
      - name: Fetch MediaInfoLib submodule
        shell: bash
        run: git submodule update --init --depth 1 extern/MediaInfoLib

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-test-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-test-${{ runner.os }}-

      # The prebuilt native for this RID, so the test host does not need a C++ toolchain.
      - name: Download native (${{ matrix.rid }})
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.native }}
          path: SharpMediaInfo.Native/native

      - name: Run tests
        shell: bash
        run: |
          set -e
          for proj in \
            SharpMediaInfo.Tests \
            SharpMediaInfo.Native.Tests \
            SharpMediaInfo.Generator.Tests \
            SharpMediaInfo.GUI.Tests ; do
            echo "::group::$proj"
            dotnet run --project "$proj" -c Release -- \
              --report-trx --report-trx-filename "${{ matrix.rid }}.$proj.trx" \
              --results-directory "$GITHUB_WORKSPACE/TestResults"
            echo "::endgroup::"
          done

      # Verify writes *.received.* next to the snapshot it did not match; show the start of
      # each diff in the log so a snapshot failure is readable without downloading artifacts.
      - name: Show snapshot diffs
        if: failure()
        shell: bash
        run: |
          find . -name '*.received.*' -not -path './extern/*' | sort | head -n 3 | while read -r received; do
            verified="${received/.received./.verified.}"
            echo "::group::$received"
            diff -u --strip-trailing-cr "$verified" "$received" | head -n 80 || true
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: |
            TestResults/*.trx
            **/*.received.*
          if-no-files-found: warn

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [version, native, test]
    env:
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the MediaInfoLib CSVs are needed here; the native comes prebuilt.
      - name: Fetch MediaInfoLib submodule
        shell: bash
        run: git submodule update --init --depth 1 extern/MediaInfoLib

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Collect every per-RID native into SharpMediaInfo.Native/native/<rid>/ so the
      # package ships runtimes for all platforms (merge-multiple keeps the <rid> folders).
      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: SharpMediaInfo.Native/native
          merge-multiple: true

      - name: List natives
        run: find SharpMediaInfo.Native/native -type f | sort

      - name: Pack
        run: |
          for PROJECT in $LIBRARY_PROJECTS; do
            dotnet pack "$PROJECT" \
              -c Release \
              -o artifacts \
              -p:VersionSuffix="$VERSION_SUFFIX" \
              -p:ContinuousIntegrationBuild=true
          done
          ls -lh artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  # Desktop GUIs, self-contained single-file per RID. Each RID ships only its own MediaInfo
  # native (runtimes/<rid>/native/ next to the executable), taken from the Native job.
  build-windows:
    name: Build Windows (${{ matrix.rid }})
    runs-on: windows-latest
    needs: [version, native]
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Only the MediaInfoLib CSVs are needed here; the native comes prebuilt.
      - name: Fetch MediaInfoLib submodule
        shell: bash
        run: git submodule update --init --depth 1 extern/MediaInfoLib

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-gui-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-gui-${{ runner.os }}-

      - name: Download native
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: SharpMediaInfo.Native/native

      - name: Publish desktop apps
        shell: bash
        run: |
          TFM=$(dotnet msbuild "$AVALONIA_PROJECT" -getProperty:DotNetTfm | tr -d '\r')
          publish() {
            dotnet publish "$1" \
              -c Release \
              -r ${{ matrix.rid }} \
              --self-contained true \
              -p:VersionSuffix="$VERSION_SUFFIX" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=embedded \
              -p:ContinuousIntegrationBuild=true \
              -o "$2" "${@:3}"
            test -f "$2/runtimes/${{ matrix.rid }}/native/mediainfo.dll" \
              || { echo "::error::$2 was published without the MediaInfo native"; exit 1; }
          }
          publish "$AVALONIA_PROJECT" "artifacts/avalonia" -f "$TFM-windows"
          publish "$WPF_PROJECT" "artifacts/wpf"

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "artifacts/avalonia/*" `
                           -DestinationPath "SharpMediaInfo-$env:VERSION-${{ matrix.rid }}.zip"
          Compress-Archive -Path "artifacts/wpf/*" `
                           -DestinationPath "SharpMediaInfo.WPF-$env:VERSION-${{ matrix.rid }}.zip"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.zip'
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.rid }})
    runs-on: ubuntu-latest
    needs: [version, native]
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch MediaInfoLib submodule
        run: git submodule update --init --depth 1 extern/MediaInfoLib

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-gui-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-gui-${{ runner.os }}-

      - name: Download native
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: SharpMediaInfo.Native/native

      - name: Publish desktop app
        run: |
          dotnet publish "$AVALONIA_PROJECT" \
            -c Release \
            -f "$(dotnet msbuild "$AVALONIA_PROJECT" -getProperty:DotNetTfm | tr -d '\r')" \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:VersionSuffix="$VERSION_SUFFIX" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=embedded \
            -p:ContinuousIntegrationBuild=true \
            -p:EnableWindowsTargeting=true \
            -o "artifacts/${{ matrix.rid }}"
          test -f "artifacts/${{ matrix.rid }}/runtimes/${{ matrix.rid }}/native/libmediainfo.so" \
            || { echo "::error::Published without the MediaInfo native"; exit 1; }

      - name: Package
        run: |
          chmod +x "artifacts/${{ matrix.rid }}/SharpMediaInfo.GUI.Avalonia"
          tar -C "artifacts/${{ matrix.rid }}" \
              -czf "SharpMediaInfo-${VERSION}-${{ matrix.rid }}.tar.gz" .

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.rid }}
          path: '*.tar.gz'
          if-no-files-found: error

  # Both macOS RIDs on one runner, like the universal Native job: the apphost must be built
  # (and ad-hoc signed) on macOS to start on Apple Silicon.
  build-macos:
    name: Build macOS (osx-arm64, osx-x64)
    runs-on: macos-latest
    needs: [version, native]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch MediaInfoLib submodule
        run: git submodule update --init --depth 1 extern/MediaInfoLib

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-gui-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-gui-${{ runner.os }}-

      - name: Download native
        uses: actions/download-artifact@v8
        with:
          name: native-osx
          path: native-osx

      - name: Publish and package desktop app
        run: |
          TFM=$(dotnet msbuild "$AVALONIA_PROJECT" -getProperty:DotNetTfm | tr -d '\r')
          for RID in osx-arm64 osx-x64; do
            # Only this RID's native, so each archive carries a single dylib.
            rm -rf SharpMediaInfo.Native/native && mkdir -p SharpMediaInfo.Native/native
            cp -R "native-osx/$RID" SharpMediaInfo.Native/native/
            dotnet publish "$AVALONIA_PROJECT" \
              -c Release \
              -f "$TFM" \
              -r "$RID" \
              --self-contained true \
              -p:VersionSuffix="$VERSION_SUFFIX" \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:DebugType=embedded \
              -p:ContinuousIntegrationBuild=true \
              -p:EnableWindowsTargeting=true \
              -o "artifacts/$RID"
            test -f "artifacts/$RID/runtimes/$RID/native/libmediainfo.dylib" \
              || { echo "::error::$RID published without the MediaInfo native"; exit 1; }
            chmod +x "artifacts/$RID/SharpMediaInfo.GUI.Avalonia"
            tar -C "artifacts/$RID" -czf "SharpMediaInfo-${VERSION}-${RID}.tar.gz" .
          done
          ls -lh SharpMediaInfo-*.tar.gz

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-osx
          path: '*.tar.gz'
          if-no-files-found: error

  prerelease:
    name: PR Pre-release
    runs-on: ubuntu-latest
    needs: [version, test, pack, build-windows, build-linux, build-macos]
    # Same-repository PRs only. A fork's pull_request run gets a read-only token, and this
    # deliberately doesn't use pull_request_target: that would run untrusted fork code with a
    # write token. Fork PRs still build and upload workflow artifacts, just no GitHub pre-release.
    # Dependabot PRs are same-repo but GitHub also gives them a read-only token.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    concurrency:
      group: prerelease-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BUILD_SHA: ${{ github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect pre-release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' -o -name '*.snupkg' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz, release/*.nupkg'

      # One pre-release per PR, replaced on every push so testers always have a single, current
      # link. Each run gets its own tag (pr-<N>-<run>-<attempt>): with immutable releases a tag
      # once used by one can never be reused, even after the release is deleted. The tag deliberately isn't "v..." so it can never be mistaken for a real
      # release by the version job's tag check.
      - name: Publish pre-release
        run: |
          TAG="pr-${PR_NUMBER}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          cat > notes.md <<NOTES
          Automatic pre-release for #${PR_NUMBER}: ${PR_TITLE}

          - Version: \`${VERSION}\`
          - PR head: ${HEAD_SHA}
          - Built from merge preview: ${BUILD_SHA}
          - Workflow run: ${RUN_URL}

          > [!WARNING]
          > Untested build of an unmerged pull request. It's replaced on every push and deleted when the PR is closed.
          NOTES

          gh release create "$TAG" release/* \
            --prerelease \
            --latest=false \
            --target "$HEAD_SHA" \
            --title "PR #${PR_NUMBER} pre-release (${VERSION})" \
            --notes-file notes.md

          # Only now drop this PR's older pre-releases, so there's always one to link to.
          # "pr-<N>-" can't match another PR's tags (pr-3- vs pr-30-).
          gh release list --limit 1000 --json tagName \
            --jq ".[].tagName | select(. == \"pr-${PR_NUMBER}\" or startswith(\"pr-${PR_NUMBER}-\")) | select(. != \"${TAG}\")" |
          while read -r OLD; do
            gh release delete "$OLD" --cleanup-tag --yes || echo "::warning::Could not delete $OLD"
          done

      - name: Comment on the pull request
        run: |
          MARKER='<!-- sharpmediainfo-prerelease -->'
          URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"
          BODY="${MARKER}
          **Pre-release \`${VERSION}\` is ready:** ${URL}

          Windows, Linux and macOS desktop builds and NuGet packages of ${HEAD_SHA}. Updated on every push, deleted when this PR is closed."

          COMMENT_ID=$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$BODY" >/dev/null
          fi

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, test, pack, build-windows, build-linux, build-macos]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
      statuses: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p release
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.nupkg' -o -name '*.snupkg' \) \
            -exec cp {} release/ \;
          ls -lh release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.zip, release/*.tar.gz, release/*.nupkg'

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        id: gh_release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

      - name: Report release status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.version.outputs.tag_exists }}" = "true" ]; then
            STATE=pending
            DESCRIPTION="Version v$VERSION already released — bump <Version> in Directory.Build.props."
          elif [ "${{ steps.gh_release.outcome }}" = "success" ]; then
            STATE=success
            DESCRIPTION="Released v$VERSION with desktop apps and NuGet packages."
          else
            STATE=failure
            DESCRIPTION="Release failed with an unexpected error."
          fi
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f description="$DESCRIPTION" \
            -f context="release"

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      packages: write
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "$FEED_URL" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  # nuget.org via Trusted Publishing. Set the repository variable NUGET_USER to the
  # nuget.org account that owns the trusted-publishing policy for this workflow; without
  # it, this job is skipped.
  publish-nuget:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      id-token: write
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NUGET_USER repository variable not set - skipping nuget.org"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NuGet artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'ga'

      - name: Log in to nuget.org
        id: login
        if: steps.config.outputs.enabled == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.config.outputs.enabled == 'true'
        env:
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$API_KEY" \
            --skip-duplicate
