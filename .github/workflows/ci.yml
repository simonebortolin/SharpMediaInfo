name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  LIBRARY_PROJECTS: >-
    SharpMediaInfo.Native/SharpMediaInfo.Native.csproj
    SharpMediaInfo/SharpMediaInfo.csproj
  FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

# Stages: Version -> Native (per RID, from the MediaInfoLib submodule) -> Test / Pack
#         -> Release (master) / Pre-release (PR) -> Publish (GitHub Packages, nuget.org)
jobs:
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_suffix: ${{ steps.resolve.outputs.version_suffix }}
      tag_exists: ${{ steps.resolve.outputs.tag_exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read version from Directory.Build.props
        id: resolve
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PREFIX=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props | head -1)
          if [ -z "$PREFIX" ]; then
            echo "::error file=Directory.Build.props::No <Version> found"
            exit 1
          fi
          if [ -n "$PR_NUMBER" ]; then
            SUFFIX="pr.${PR_NUMBER}.${RUN_NUMBER}"
            VERSION="${PREFIX}-${SUFFIX}"
          else
            SUFFIX=""
            VERSION="$PREFIX"
          fi
          {
            echo "version=$VERSION"
            echo "version_suffix=$SUFFIX"
          } >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$PREFIX" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "### Version \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

  native:
    name: Native (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # win-arm64 is not built: the pinned ZenLib MSVC project has no ARM64 configuration.
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          # Cross-compiled on Apple Silicon (Intel macOS runner images are retired).
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config zlib1g-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Build native (${{ matrix.rid }})
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File SharpMediaInfo.Native/build/build-native.ps1 -Rid ${{ matrix.rid }}
          else
            bash SharpMediaInfo.Native/build/build-native.sh ${{ matrix.rid }}
          fi

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: SharpMediaInfo.Native/native/${{ matrix.rid }}
          if-no-files-found: error

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [native]
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
          - name: Windows
            os: windows-latest
            rid: win-x64
          - name: macOS
            os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-test-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-test-${{ runner.os }}-

      # The prebuilt native for this RID, so the test host does not need a C++ toolchain.
      - name: Download native (${{ matrix.rid }})
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: SharpMediaInfo.Native/native/${{ matrix.rid }}

      - name: Run tests
        shell: bash
        run: |
          set -e
          for proj in \
            SharpMediaInfo.Tests \
            SharpMediaInfo.Native.Tests \
            SharpMediaInfo.Generator.Tests \
            SharpMediaInfo.GUI.Tests ; do
            echo "::group::$proj"
            dotnet run --project "$proj" -c Release -- \
              --report-trx --report-trx-filename "${{ matrix.name }}.$proj.trx" \
              --results-directory "$GITHUB_WORKSPACE/TestResults"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults/*.trx
          if-no-files-found: warn

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [version, native, test]
    env:
      VERSION_SUFFIX: ${{ needs.version.outputs.version_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Collect every per-RID native into SharpMediaInfo.Native/native/<rid>/ so the
      # package ships runtimes for all platforms (merge-multiple keeps the <rid> folders).
      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: SharpMediaInfo.Native/native
          merge-multiple: true

      - name: List natives
        run: find SharpMediaInfo.Native/native -type f | sort

      - name: Pack
        run: |
          for PROJECT in $LIBRARY_PROJECTS; do
            dotnet pack "$PROJECT" \
              -c Release \
              -o artifacts \
              -p:VersionSuffix="$VERSION_SUFFIX" \
              -p:ContinuousIntegrationBuild=true
          done
          ls -lh artifacts

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  release:
    name: Tag & Release
    runs-on: ubuntu-latest
    needs: [version, test, pack]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Tag release
        id: tag
        if: needs.version.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        if: steps.tag.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: release/*

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      packages: write
    steps:
      - name: Download NuGet artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "$FEED_URL" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

  # nuget.org via Trusted Publishing. Set the repository variable NUGET_USER to the
  # nuget.org account that owns the trusted-publishing policy for this workflow; without
  # it, this job is skipped.
  publish-nuget:
    name: Publish to nuget.org
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.tag_exists != 'true'
    permissions:
      id-token: write
    env:
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "$NUGET_USER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::NUGET_USER repository variable not set - skipping nuget.org"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NuGet artifact
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg

      - name: Setup .NET
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Log in to nuget.org
        id: login
        if: steps.config.outputs.enabled == 'true'
        uses: NuGet/login@v1
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.config.outputs.enabled == 'true'
        env:
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$API_KEY" \
            --skip-duplicate
